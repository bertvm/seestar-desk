services:
  desk:
    build: .
    image: seestar-desk
    # Built here. There is no public image to pull.
    pull_policy: build
    container_name: seestar-desk
    restart: unless-stopped
    # UDP discovery and the telescope's control port stay on the Docker host's LAN.
    network_mode: host
    environment:
      HOME: /data
      SEESTAR_KEY_PATH: /data/seestar.pem
    volumes:
      - ./docker-data:/data
