<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seestar Desk</title>
  <link rel="stylesheet" href="/static/app.css?v=8">
</head>
<body>
  <header class="strip">
    <div class="brand">
      <span id="brand-mark" class="brand-mark"></span>
      <div>
        <strong>Seestar Desk</strong>
        <span id="scope-name">No telescope</span>
      </div>
    </div>
    <div class="meters" id="meters"></div>
    <div class="clock" id="clock"></div>
  </header>
  <div class="shell">
    <nav>
      <button data-page="overview" class="active"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="10" width="13" height="5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="14.5" cy="12.5" r="1.2" fill="currentColor"/><path d="M8 15v3h7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Overview</button>
      <button data-page="sky"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l1.6 4.4 4.6.3-3.6 3 1.1 4.5L12 13.4 8.3 15.7l1.1-4.5-3.6-3 4.6-.3z" fill="currentColor"/></svg>Sky</button>
      <button data-page="picture"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="2.4" fill="currentColor"/></svg>Picture</button>
      <button data-page="align"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 5.5l2.2 6.3H12l-2.2-6.3z" fill="currentColor"/><path d="M12 18.5l-2.2-6.3H12l2.2 6.3z" fill="currentColor" opacity="0.45"/></svg>Align</button>
      <button data-page="album"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="14" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 15l2.4-2.6 1.8 1.8L14 11l4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>Album</button>
      <button data-page="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h10M18 8h2M4 16h2M10 16h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="16" cy="8" r="2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="8" cy="16" r="2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>Settings</button>
    </nav>
    <main id="main"></main>
  </div>
  <script src="/static/app.js?v=8"></script>
</body>
</html>
